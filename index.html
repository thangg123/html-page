<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danh sách trang HTML</title>
    <style>
      :root {
        --bg: oklch(98% 0.01 250);
        --surface: oklch(100% 0 0);
        --text: oklch(20% 0.02 250);
        --muted: oklch(55% 0.02 250);
        --accent: oklch(60% 0.19 260);
        --border: oklch(92% 0.01 250);
        --radius: 14px;
        --shadow: 0 1px 2px oklch(20% 0.02 250 / 0.04),
          0 8px 24px oklch(20% 0.02 250 / 0.06);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
          system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 820px;
        margin: 0 auto;
        padding: clamp(2rem, 4vw, 4rem) clamp(1rem, 4vw, 2rem) 4rem;
      }
      header { margin-bottom: 2rem; }
      h1 {
        font-size: clamp(1.75rem, 1rem + 2vw, 2.5rem);
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      .subtitle { color: var(--muted); margin: 0; }
      .search {
        position: relative;
        margin: 1.75rem 0 1.25rem;
      }
      .search input {
        width: 100%;
        padding: 0.95rem 1rem 0.95rem 2.75rem;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
        transition: border-color 150ms, box-shadow 150ms;
        outline: none;
      }
      .search input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px oklch(60% 0.19 260 / 0.15);
      }
      .search svg {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      .count {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0 0 0.75rem 0.25rem;
      }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.625rem; }
      li a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.25rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text);
        box-shadow: var(--shadow);
        transition: transform 150ms cubic-bezier(0.16, 1, 0.3, 1),
          border-color 150ms, box-shadow 150ms;
      }
      li a:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 2px 4px oklch(20% 0.02 250 / 0.05),
          0 16px 32px oklch(20% 0.02 250 / 0.1);
      }
      .name { font-weight: 600; letter-spacing: -0.01em; }
      .file { font-size: 0.8rem; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .arrow { color: var(--muted); transition: transform 150ms, color 150ms; }
      li a:hover .arrow { color: var(--accent); transform: translateX(4px); }
      .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
      }
      .empty[hidden] { display: none; }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(16% 0.02 260);
          --surface: oklch(22% 0.02 260);
          --text: oklch(96% 0.01 250);
          --muted: oklch(65% 0.02 250);
          --border: oklch(30% 0.02 260);
          --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 8px 24px oklch(0% 0 0 / 0.4);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Danh sách trang HTML</h1>
        <p class="subtitle">Các tài liệu quy trình và hướng dẫn trong project.</p>
      </header>

      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Tìm theo tên…" autocomplete="off" autofocus />
      </div>

      <p class="count"><span id="visible">0</span> / <span id="total">0</span> trang</p>

      <ul id="list"></ul>

      <div class="empty" id="empty" hidden>Không tìm thấy trang nào khớp.</div>
    </main>

    <script>
      const input = document.getElementById("q");
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      const visibleEl = document.getElementById("visible");
      const totalEl = document.getElementById("total");

      const normalize = (s) =>
        s
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d");

      let rows = [];

      function buildRow(item) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = item.file;
        const wrap = document.createElement("span");
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = item.title;
        const file = document.createElement("div");
        file.className = "file";
        file.textContent = item.file;
        wrap.appendChild(name);
        wrap.appendChild(file);
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "→";
        a.appendChild(wrap);
        a.appendChild(arrow);
        li.appendChild(a);
        return { li, haystack: normalize(`${item.title} ${item.file}`) };
      }

      function filter() {
        const q = normalize(input.value.trim());
        let visible = 0;
        rows.forEach(({ li, haystack }) => {
          const show = !q || haystack.includes(q);
          li.hidden = !show;
          if (show) visible++;
        });
        visibleEl.textContent = visible;
        empty.hidden = visible !== 0;
      }

      input.addEventListener("input", filter);

      fetch("files.json", { cache: "no-store" })
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then((data) => {
          rows = data.map(buildRow);
          rows.forEach(({ li }) => list.appendChild(li));
          totalEl.textContent = rows.length;
          filter();
        })
        .catch((err) => {
          empty.hidden = false;
          empty.textContent = `Không tải được files.json: ${err.message}`;
        });
    </script>
  </body>
</html>
