<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh sách tài liệu — Arena Billiard</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f8f9fb;
    --surface-2: #f1f3f7;
    --border: #e2e6ed;
    --border-light: #eef0f4;
    --text: #1a1f2e;
    --text-2: #3d4560;
    --text-muted: #7a839b;
    --accent: #2563eb;
    --accent-light: #eff4ff;
    --font: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .header {
    margin-bottom: 40px;
    padding-bottom: 32px;
    border-bottom: 2px solid var(--border);
  }

  .header .org {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    margin-bottom: 8px;
  }

  .header p { color: var(--text-muted); font-size: 15px; }

  .search {
    position: relative;
    margin-bottom: 16px;
  }

  .search input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    font-size: 15px;
    font-family: var(--font);
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 150ms, background 150ms, box-shadow 150ms;
  }

  .search input::placeholder { color: var(--text-muted); }

  .search input:focus {
    border-color: var(--accent);
    background: var(--bg);
    box-shadow: 0 0 0 3px var(--accent-light);
  }

  .search svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.3px;
    margin-bottom: 20px;
  }

  ul#list {
    list-style: none;
    border-top: 1px solid var(--border);
  }

  ul#list li {
    border-bottom: 1px solid var(--border-light);
  }

  ul#list li a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 16px 8px;
    text-decoration: none;
    color: var(--text);
    transition: background 120ms, padding 150ms;
  }

  ul#list li a:hover {
    background: var(--accent-light);
    padding-left: 16px;
    padding-right: 16px;
  }

  ul#list li a .idx {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    min-width: 32px;
    letter-spacing: 0.5px;
  }

  ul#list li a .body { flex: 1; min-width: 0; }

  ul#list li a .name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
    letter-spacing: -0.1px;
  }

  ul#list li a .file {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  ul#list li a:hover .name { color: var(--accent); }

  ul#list li a .arrow {
    font-size: 16px;
    color: var(--text-muted);
    transition: color 120ms, transform 150ms;
  }

  ul#list li a:hover .arrow {
    color: var(--accent);
    transform: translateX(3px);
  }

  .empty {
    padding: 40px 24px;
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
  .empty[hidden] { display: none; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="org">Arena Billiard</div>
      <h1>Danh sách tài liệu</h1>
      <p>Các trang quy trình và hướng dẫn nội bộ.</p>
    </div>

    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Tìm theo tên…" autocomplete="off" autofocus />
    </div>

    <div class="count"><span id="visible">0</span> / <span id="total">0</span> TRANG</div>

    <ul id="list"></ul>

    <div class="empty" id="empty" hidden>Không tìm thấy trang nào khớp.</div>
  </div>

<script>
  const input = document.getElementById("q");
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const visibleEl = document.getElementById("visible");
  const totalEl = document.getElementById("total");

  const normalize = (s) =>
    s.toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/đ/g, "d");

  let rows = [];

  function buildRow(item, index) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = item.file;

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(index + 1).padStart(2, "0");

    const body = document.createElement("div");
    body.className = "body";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = item.title;
    const file = document.createElement("div");
    file.className = "file";
    file.textContent = item.file;
    body.appendChild(name);
    body.appendChild(file);

    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "→";

    a.appendChild(idx);
    a.appendChild(body);
    a.appendChild(arrow);
    li.appendChild(a);
    return { li, idxEl: idx, haystack: normalize(`${item.title} ${item.file}`) };
  }

  function filter() {
    const q = normalize(input.value.trim());
    let visible = 0;
    rows.forEach(({ li, idxEl, haystack }) => {
      const show = !q || haystack.includes(q);
      li.hidden = !show;
      if (show) {
        visible++;
        idxEl.textContent = String(visible).padStart(2, "0");
      }
    });
    visibleEl.textContent = visible;
    empty.hidden = visible !== 0;
  }

  input.addEventListener("input", filter);

  fetch("files.json", { cache: "no-store" })
    .then((r) => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then((data) => {
      rows = data.map(buildRow);
      rows.forEach(({ li }) => list.appendChild(li));
      totalEl.textContent = rows.length;
      filter();
    })
    .catch((err) => {
      empty.hidden = false;
      empty.textContent = `Không tải được files.json: ${err.message}`;
    });
</script>
</body>
</html>
